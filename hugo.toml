baseURL = 'https://synergyvr.org/synergy/'
CanonifyURLs=true
locale = 'en-us'
title = "Synergy VR for Skyrim VR"
theme = 'relearn'
# The shared Synergy layer (shortcodes, styles, scripts, layout overrides) is a
# Hugo Module. It must resolve ahead of Relearn so its overrides win, which is
# what listing it here while Relearn stays in `theme` above achieves.
#
# To work against a local checkout of the module, set HUGO_MODULE_REPLACEMENTS in
# the environment rather than adding a `replacements` line here, so a dev-only
# path can never end up committed. The module's README has the full command.
[module]
  [[module.imports]]
    path = 'github.com/synergyvr-org/synergy-hugo-shared'

[params]
  themeVariant = 'zen-dark'
  disableInlineCopyToClipBoard = true

  # Keep sub-tables last: in TOML every key after a [params.x] header belongs to
  # that sub-table, so scalars above would be swallowed.
  [params.synergy]
    logo = 'synergy-logo.webp'
    logo2x = 'synergy-logo@2x.webp'
    logoAlt = 'Synergy VR, a mod list for Skyrim VR'
    footerCredit = 'Synergy VR by [Synergy Team](https://synergyvr.org/)'
    footerCredit2 = 'Docs by Davey'
    # This list's own screenshots, randomized behind each page's title banner.
    # Cropped 2.4:1 from Quest captures; the banner scales its height with the
    # viewport, so a taller crop shows the whole frame on narrow screens.
    # Every cover ships an @2x sibling, so the banner can use image-set().
    coverRetina = '@2x'
    coverImages = [
      'ss-river-lodge.webp',
      'ss-cloud-sea.webp',
      'ss-snowy-pines.webp',
      'ss-autumn-aspens.webp',
      'ss-ivy-farmstead.webp',
      'ss-windmill-road.webp',
      'ss-misty-dock.webp',
      'ss-aurora-shore.webp',
      'ss-stone-arch.webp',
      'ss-hot-spring.webp',
      'ss-starlit-gate.webp',
      'ss-thatched-village.webp',
    ]

    # Load-order separator colors, matching this list's MO2 sections.
    [params.synergy.modlist]
      subtree = ['#7ec8e3', '#2d6c88']
      subtreeRoot = 'START HERE - EXPAND TO SETUP'
      titlePrefix = 'Synergy VR - Beta Release'
      # One continuous ramp over every section, taken from the colors the list
      # itself uses in MO2: burnt orange fading to black across the content half,
      # then black deepening into blue down the rest. Sampled from MO2's own
      # pane, where it's a straight line in RGB (red 164 to 0 and green 82 to 0
      # over the first 22 sections, then blue 0 to 242 over the remaining 19).
      #
      # It used to be two bands, orange-to-brown and then a separate blue, which
      # put a hard edge at AI Improvements where the second band began. Black in
      # the middle is what lets the two halves meet without a seam.
      [[params.synergy.modlist.bands]]
        stops = ['#a45200', '#000000', '#0000f2']
      # MO2 gives the end marker the same orange as the list's title banner.
      [[params.synergy.modlist.bands]]
        from = 'End of List'
        stops = ['#e8913a']
    # The Skyrim art behind alert asides comes from the shared module.
[caches]
  [caches.images]
    dir = ':cacheDir/images'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
