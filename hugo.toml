baseURL = 'https://synergyvr.org/synergy/'
CanonifyURLs=true
locale = 'en-us'
title = "Synergy VR for Skyrim VR"
theme = 'relearn'
# The shared Synergy layer (shortcodes, styles, scripts, layout overrides) is a
# Hugo Module. It must resolve ahead of Relearn so its overrides win, which is
# what listing it here while Relearn stays in `theme` above achieves.
#
# To work against a local checkout of the module, set HUGO_MODULE_REPLACEMENTS in
# the environment rather than adding a `replacements` line here, so a dev-only
# path can never end up committed. The module's README has the full command.
[module]
  [[module.imports]]
    path = 'github.com/synergyvr-org/synergy-hugo-shared'

[params]
  themeVariant = 'zen-dark'
  disableInlineCopyToClipBoard = true

  # Keep sub-tables last: in TOML every key after a [params.x] header belongs to
  # that sub-table, so scalars above would be swallowed.
  [params.synergy]
    logo = 'synergy-logo.webp'
    logo2x = 'synergy-logo@2x.webp'
    logoAlt = 'Synergy VR, a mod list for Skyrim VR'
    footerCredit = 'Synergy VR by [Synergy Team](https://synergyvr.org/)'
    footerCredit2 = 'Docs by Davey'

    # Load-order separator colors, matching this list's MO2 sections.
    [params.synergy.modlist]
      subtree = ['#7ec8e3', '#2d6c88']
      subtreeRoot = 'START HERE - EXPAND TO SETUP'
      titlePrefix = 'Synergy VR - Beta Release'
      [[params.synergy.modlist.bands]]
        stops = ['#f0a03c', '#c2661c', '#5a2f14']
      [[params.synergy.modlist.bands]]
        from = 'AI Improvements'
        stops = ['#2a5f9e', '#16314f']
      [[params.synergy.modlist.bands]]
        from = 'End of List'
        stops = ['#e8913a']
    # coverImages is deliberately unset until this list has its own screenshots.
    # Without it the cover randomizer simply doesn't run. The Skyrim art behind
    # alert asides comes from the shared module.
[caches]
  [caches.images]
    dir = ':cacheDir/images'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
